<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murder in Hong Kong</title>
<style>
:root{color-scheme:dark;--bg:#0d0f1a;--card:#171a2b;--line:#2a2f4a;--tx:#eef0ff;--mu:#8b90b3;--red:#ff3b5c;--cy:#2ee6d6;--yl:#ffc94d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
h1{font-size:24px;margin:4px 0;color:var(--red)}h2{font-size:18px;margin:18px 0 8px;color:var(--cy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
button{font:inherit;color:var(--tx);background:var(--line);border:0;border-radius:10px;padding:10px 14px;margin:3px}
button.p{background:var(--red);font-weight:600;width:100%;padding:14px;margin:10px 0}
button.sel{background:var(--cy);color:#000;font-weight:600}button:disabled{opacity:.4}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;margin:4px 0}
.mu{color:var(--mu);font-size:14px}.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin:2px;font-size:14px}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between}.code{font-size:44px;letter-spacing:8px;text-align:center;color:var(--yl);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}body.wide #app{max-width:1200px}body.wide .chip{font-size:18px;padding:6px 10px}body.wide .mu{font-size:17px}
.big{text-align:center;padding:30px 10px}.big b{font-size:26px;color:var(--yl)}.err{color:var(--red)}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const MEANS=["Meat cleaver","Poisoned milk tea","Junk boat rope","Mahjong tile (stuffed)","Umbrella spike","Bamboo scaffold pole","Dim sum steamer","Tram cable","Neon sign tube","Wok","Chopsticks","Jade hairpin","Fishing hook","Ferry anchor chain","Opera sword","Pufferfish","Firecracker","Boiling teapot","Abacus","Tai chi sword","Rickshaw wheel","Tong lau brick","Typhoon shutter","Salt-fish hammer","Lift cable","Hot cooking oil","Durian","Ceremonial incense","Fountain pen","Dragon boat paddle"];
const CLUES=["Egg tart crumbs","Octopus card","Red packet","Jade bracelet","Fortune stick","Joss paper ash","Torn newspaper","Wet umbrella","Mahjong score sheet","Lucky cat","Cha chaan teng receipt","Fish scale","Tiger balm smell","Muddy sandals","Broken glasses","Foggy mirror","Incense stick","Pocket watch","Dried mushroom","Mooncake tin","Sticky rice","Peak Tram ticket","Missing button","Smudged lipstick","Soy sauce stain","Bird cage key","Cracked phone","Lantern","Silk thread","Chilli oil drop"];
const FIX=[{t:"Cause of Death",o:["Bludgeoning","Strangulation","Poisoning","Stabbing","Drowning","Fall"]},{t:"Location of Crime",o:["Peak Tram","Wet market","Cha chaan teng","Star Ferry pier","Night market","Rooftop"]}];
const SCENE=[{t:"Time of Death",o:["Dawn","Morning","Noon","Dusk","Night","Midnight"]},{t:"Weather",o:["Clear","Typhoon 8","Drizzle","Heatwave","Fog","Humid"]},{t:"State of Scene",o:["Tidy","Ransacked","Ritual-like","Staged","Hurried","Calm"]},{t:"Motive",o:["Money","Revenge","Love","Secret","Fear","Jealousy"]},{t:"Murderer's Look",o:["Hat","Uniform","Bag","Gloves","Soaked","Perfumed"]},{t:"Sound Heard",o:["Gong","Shout","Whisper","Crash","Music","Silence"]},{t:"Victim's Mood",o:["Calm","Angry","Afraid","Drunk","Rushed","Sad"]},{t:"Evidence Left",o:["Footprints","Fibre","Blood","Fingerprint","Hair","Ash"]}];
const RN={fs:"Forensic Scientist",mu:"Murderer",ac:"Accomplice",iv:"Investigator"};
const A=document.getElementById('app'),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let peer,hostConn,S,isHost=false,V=null,ui={},msg="";

/* ---------- HOST (authoritative; holds all secrets) ---------- */
function startHost(name){
 isHost=true;const L="ABCDEFGHJKLMNPQRSTUVWXYZ",code=Array.from({length:4},()=>L[Math.random()*24|0]).join("");
 peer=new Peer("hkm-"+code);
 peer.on('open',()=>{S={ph:'lobby',code,ps:[{name,host:true}],specs:[]};push()});
 peer.on('error',e=>{if(e.type=='unavailable-id')startHost(name);else fail("Connection error: "+e.type)});
 peer.on('connection',c=>{
  c.on('data',m=>{
   if(m.t=='spec'){S.specs.push(c);c.send({t:'v',v:specView()});return}
   if(m.t=='join'){if(S.ph!='lobby'||S.ps.length>=8){c.send({t:'no'});return}S.ps.push({name:String(m.name).slice(0,14),conn:c});push()}
   else{const i=S.ps.findIndex(p=>p.conn===c);if(i>0)act(i,m)}});
  c.on('close',()=>{const n=S.specs.length;S.specs=S.specs.filter(x=>x!==c);if(n!=S.specs.length){push();return}const i=S.ps.findIndex(p=>p.conn===c);if(i<1)return;if(S.ph=='lobby')S.ps.splice(i,1);else S.ps[i].off=true;push()})})}
function push(){S.specs.forEach(c=>c.open&&c.send({t:'v',v:specView()}));S.ps.forEach((p,i)=>{const v=view(i);if(p.host)show(v);else if(p.conn&&p.conn.open)p.conn.send({t:'v',v})})}
function view(i){const p=S.ps[i],end=S.ph=='end',fs=p.role=='fs';
 const know=q=>end||q===p||q.role=='fs'||fs||(p.role=='mu'&&q.role=='ac')||(p.role=='ac'&&q.role=='mu');
 return{ph:S.ph,code:S.code,me:i,host:!!p.host,role:p.role,ps:S.ps.map(q=>({n:q.name,off:q.off,r:know(q)?q.role:null,m:q.m,c:q.c,b:S.bd?S.bd[S.ps.indexOf(q)]:0})),
  sol:(S.sol&&(end||['fs','ac','mu'].includes(p.role)))?S.sol:null,mu:S.ps.findIndex(q=>q.role=='mu'),tiles:S.tiles,rd:S.rd,log:S.log,win:S.win,hb:S.specs.length>0,res:S.res?S.res[i]:null}}
function specView(){const end=S.ph=='end';return{board:1,ph:S.ph,code:S.code,ps:S.ps.map((q,j)=>({n:q.name,off:q.off,r:(end||q.role=='fs')?q.role:null,m:q.m,c:q.c,b:S.bd?S.bd[j]:0})),sol:end?S.sol:null,mu:end?S.ps.findIndex(q=>q.role=='mu'):-1,tiles:S.tiles,rd:S.rd,log:S.log,win:S.win}}
function act(i,m){const p=S.ps[i],mu=S.ps.findIndex(q=>q.role=='mu');
 if(m.t=='start'&&p.host&&S.ph=='lobby'&&S.ps.length>=4)deal();
 else if(m.t=='pick'&&S.ph=='pick'&&i==mu&&p.m[m.m]&&p.c[m.c]){S.sol={m:p.m[m.m],c:p.c[m.c]};S.ph='play'}
 else if(S.ph=='play'&&p.role=='fs'){
  if(m.t=='mark'&&S.tiles[m.ti]){const t=S.tiles[m.ti];t.s=t.s===m.oi?null:m.oi}
  if(m.t=='swap'&&m.ti>1&&S.spare.length)S.tiles[m.ti]={...S.spare.shift(),s:null};
  if(m.t=='next')S.rd=Math.min(3,S.rd+1)}
 else if(m.t=='acc'&&S.ph=='play'&&p.role=='iv'&&S.bd[i]){const q=S.ps[m.sp];if(!q||q.role=='fs')return;S.bd[i]=false;
  const ok=S.ps.indexOf(q)==mu&&q.m[m.sm]==S.sol.m&&q.c[m.sc]==S.sol.c;S.res[i]={ok,txt:q.name+" · "+q.m[m.sm]+" · "+q.c[m.sc]};if(ok)S.right=true}
 else if(m.t=='reveal'&&p.host&&S.ph=='play'){S.win=S.right?'iv':'mu';S.ph='end'}
 else if(m.t=='again'&&p.host){S.ph='lobby';S.sol=null;S.ps.forEach(q=>{delete q.role;delete q.m;delete q.c})}
 push()}
function deal(){const n=S.ps.length,ix=sh([...Array(n).keys()].slice(1)),M=sh(MEANS),C=sh(CLUES);let k=0;
 S.ps.forEach(q=>q.off=false);
 S.ps[0].role='iv';S.ps[ix[0]].role='fs';S.ps[ix[1]].role='mu';ix.slice(2).forEach((j,x)=>S.ps[j].role=(n>=6&&x==0)?'ac':'iv');
 S.ps.forEach(q=>{if(q.role!='fs'){q.m=M.slice(k*4,k*4+4);q.c=C.slice(k*4,k*4+4);k++}});
 const sc=sh(SCENE);S.tiles=[...FIX,...sc.slice(0,4)].map(t=>({...t,s:null}));S.spare=sc.slice(4);
 S.bd=S.ps.map(q=>q.role=='iv');S.res={};S.right=false;S.rd=1;S.log=[];S.sol=null;S.win=null;S.ph='pick';ui={}}

/* ---------- CLIENT ---------- */
function startJoin(name,code){
 peer=new Peer();
 peer.on('open',()=>{hostConn=peer.connect("hkm-"+code.toUpperCase(),{reliable:true});
  hostConn.on('open',()=>hostConn.send({t:'join',name}));
  hostConn.on('data',m=>{if(m.t=='v')show(m.v);if(m.t=='no')fail("Game already started or room full.")});
  hostConn.on('close',()=>fail("Disconnected from host."))});
 peer.on('error',e=>fail(e.type=='peer-unavailable'?"Room not found.":"Connection error: "+e.type))}
function startSpec(code){
 peer=new Peer();
 peer.on('open',()=>{hostConn=peer.connect("hkm-"+code.toUpperCase(),{reliable:true});
  hostConn.on('open',()=>hostConn.send({t:'spec'}));
  hostConn.on('data',m=>{if(m.t=='v')show(m.v)});
  hostConn.on('close',()=>fail("Disconnected from host."))});
 peer.on('error',e=>fail(e.type=='peer-unavailable'?"Room not found.":"Connection error: "+e.type))}
function send(m){isHost?act(0,m):hostConn&&hostConn.send(m)}
function fail(t){msg=t;V=null;entry()}

/* ---------- UI ---------- */
function entry(){document.body.classList.remove('wide');
 const rc=new URLSearchParams(location.search).get('room')||"";
 A.innerHTML=`<h1>Murder in Hong Kong</h1><p class="mu">Online social deduction for 4–8 players. Each person uses their own phone.</p><p class="err">${esc(msg)}</p>
 <div class="card"><input id="nm" maxlength="14" placeholder="Your name"><h2>Host a game</h2><button class="p" onclick="go('h')">Create room</button>
 <h2>Join a game</h2><input id="rc" maxlength="4" placeholder="Room code" value="${esc(rc)}" style="text-transform:uppercase"><button class="p" onclick="go('j')">Join room</button>
 <h2>Shared board</h2><p class="mu">Open this on a TV or laptop (enter the room code above) so everyone can see the scene tiles and evidence.</p><button class="p" onclick="go('s')">Open shared board</button></div>`}
function go(k){const n=document.getElementById('nm').value.trim()||"Player",c=document.getElementById('rc').value.trim();msg="";
 if(k!='h'&&c.length!=4){msg="Enter the 4-letter room code.";return entry()}
 A.innerHTML='<p class="mu">Connecting…</p>';k=='h'?startHost(n):k=='j'?startJoin(n,c):startSpec(c)}
function show(v){V=v;draw()}
function chips(a){return(a||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}
function draw(){const v=V;if(!v)return entry();
 if(v.board)return drawBoard(v);
 if(v.ph=='lobby'){const link=location.origin+location.pathname+"?room="+v.code;
  return A.innerHTML=`<h1>Lobby</h1><div class="code">${v.code}</div><p class="mu" style="text-align:center">Share this code or link:<br>${esc(link)}</p>
  <div class="card">${v.ps.map(p=>`<div>${esc(p.n)}</div>`).join("")}</div><p class="mu">${v.ps.length}/8 players (need 4+)</p>
  ${v.host?`<button class="p" ${v.ps.length<4?"disabled":""} onclick="send({t:'start'})">Deal cards</button>`:'<p class="mu">Waiting for host to start…</p>'}`}
 const me=v.ps[v.me],top=`<div class="row"><h1>${v.ph=='end'?"Case closed":"Crime Scene"}</h1><span class="chip">Round ${v.rd}/3</span></div>
 <div class="card">You are the <b style="color:var(--yl)">${RN[v.role]}</b>.${v.role=='iv'?" Find the murderer, the Means and the Clue. One accusation, and only you see the result.":""}${v.role=='fs'?" Mark the tiles to hint at the truth. Don't speak.":""}${v.role=='mu'||v.role=='ac'?" Don't get caught.":""}
 ${v.ps.filter(p=>p.r&&p.r!='iv'&&p.r!=v.role).map(p=>`<br>${esc(p.n)}: ${RN[p.r]}`).join("")}
 ${v.sol?`<br>Solution: <b>${esc(v.ps[v.mu].n)}</b> · ${esc(v.sol.m)} · ${esc(v.sol.c)}`:""}</div>`;
 if(v.ph=='pick'){
  if(v.role=='mu')return A.innerHTML=top+`<h2>Choose your Means</h2>${me.m.map((x,i)=>`<button class="${ui.m===i?'sel':''}" onclick="ui.m=${i};draw()">${esc(x)}</button>`).join("")}<h2>Choose your Clue</h2>${me.c.map((x,i)=>`<button class="${ui.c===i?'sel':''}" onclick="ui.c=${i};draw()">${esc(x)}</button>`).join("")}<button class="p" ${ui.m==null||ui.c==null?"disabled":""} onclick="send({t:'pick',m:ui.m,c:ui.c})">Commit the murder</button>`;
  return A.innerHTML=top+`<p class="mu">Waiting for the murderer to choose…</p>`+(v.hb?"":evidence(v))}
 if(v.ph=='end')return A.innerHTML=top+`<div class="big"><b>${v.win=='iv'?"Investigators win!":"Murderer wins!"}</b></div>`+(v.hb?"":evidence(v))+(v.host?`<button class="p" onclick="send({t:'again'})">Back to lobby</button>`:"");
 const fs=v.role=='fs';
 A.innerHTML=top+(v.hb&&!fs?'<p class="mu">Watch the shared board for the scene tiles and evidence.</p>':v.tiles.map((t,ti)=>`<div class="card"><div class="row"><b>${t.t}</b>${fs&&ti>1?`<button onclick="send({t:'swap',ti:${ti}})">Swap</button>`:""}</div>${t.o.map((o,oi)=>`<button class="${t.s===oi?'sel':''}" ${fs?`onclick="send({t:'mark',ti:${ti},oi:${oi}})"`:"disabled"}>${o}</button>`).join("")}</div>`).join(""))
  +(fs?`<button onclick="send({t:'next'})">Next round</button>`:"")+(v.hb?"":evidence(v))+accuse(v)+(v.host?'<button class="p" onclick="send({t:\'reveal\'})">Reveal solution & end game</button>':"")+v.log.map(l=>`<p class="mu">${esc(l)}</p>`).join("")}
function drawBoard(v){document.body.classList.add('wide');
 if(v.ph=='lobby')return A.innerHTML=`<h1>Murder in Hong Kong</h1><div class="code">${v.code}</div><p class="mu" style="text-align:center">Join on your phone with this code</p><div class="grid">${v.ps.map(p=>`<div class="card"><b>${esc(p.n)}</b></div>`).join("")}</div>`;
 const end=v.ph=='end';
 A.innerHTML=`<div class="row"><h1>${end?"Case closed":"Crime Scene"}</h1><span class="chip">Round ${v.rd}/3</span></div>
 ${end?`<div class="big"><b>${v.win=='iv'?"Investigators win!":"Murderer wins!"}</b><p>${esc(v.ps[v.mu].n)} · ${esc(v.sol.m)} · ${esc(v.sol.c)}</p></div>`:v.ph=='pick'?'<p class="mu">The murderer is choosing…</p>':""}
 <div class="grid">${v.tiles.map(t=>`<div class="card"><b>${t.t}</b><div>${t.o.map((o,i)=>`<span class="chip ${t.s===i?'on':''}">${o}</span>`).join("")}</div></div>`).join("")}</div>
 <h2>Suspects</h2><div class="grid">${v.ps.map(p=>p.m?`<div class="card"><div class="row"><b>${esc(p.n)}${p.off?" (offline)":""}</b>${p.b?'<span class="chip on">badge</span>':'<span class="chip">no badge</span>'}</div><div class="mu">Means</div>${chips(p.m)}<div class="mu">Clues</div>${chips(p.c)}</div>`:`<div class="card"><b>${esc(p.n)}</b><div class="mu">Forensic Scientist</div></div>`).join("")}</div>
 ${v.log.map(l=>`<p class="mu">${esc(l)}</p>`).join("")}`}
function evidence(v){return`<h2>Evidence</h2>`+v.ps.map(p=>p.m?`<div class="card"><b>${esc(p.n)}</b>${p.off?" (disconnected)":""}<div class="mu">Means</div>${chips(p.m)}<div class="mu">Clues</div>${chips(p.c)}</div>`:`<div class="card"><b>${esc(p.n)}</b> – Forensic Scientist</div>`).join("")}
function accuse(v){const me=v.ps[v.me];if(v.role=='iv'&&v.res)return`<h2>Your accusation</h2><div class="card">${esc(v.res.txt)}<br><b style="color:var(${v.res.ok?'--cy':'--red'})">${v.res.ok?"CORRECT":"WRONG"}</b><p class="mu">Only you can see this. Say it out loud when you're ready.</p></div>`;if(v.role!='iv'||!me.b)return"";const a=ui.a||(ui.a={});
 let h=`<h2>Your accusation</h2><div class="mu">Suspect</div>`+v.ps.map((p,i)=>p.r=='fs'?"":`<button class="${a.sp===i?'sel':''}" onclick="ui.a={sp:${i}};draw()">${esc(p.n)}</button>`).join("");
 if(a.sp!=null){const t=v.ps[a.sp];h+=`<div class="mu">Means</div>`+t.m.map((x,i)=>`<button class="${a.sm===i?'sel':''}" onclick="ui.a.sm=${i};draw()">${esc(x)}</button>`).join("")+`<div class="mu">Clue</div>`+t.c.map((x,i)=>`<button class="${a.sc===i?'sel':''}" onclick="ui.a.sc=${i};draw()">${esc(x)}</button>`).join("")+`<button class="p" ${a.sm==null||a.sc==null?"disabled":""} onclick="send({t:'acc',sp:${a.sp},sm:ui.a.sm,sc:ui.a.sc});ui.a=null">Final accusation (one shot)</button>`}
 return h}
entry();
</script></body></html>
